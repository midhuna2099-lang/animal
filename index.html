<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachable Machine Model</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #007bff;
      color: white;
    }

    #webcam-container {
      margin: 20px auto;
    }

    #label-container {
      font-size: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Teachable Machine Model</h1>

  <button onclick="init()">Start Camera</button>

  <div id="webcam-container"></div>
  <div id="label-container"></div>

  <script>
    // Your Teachable Machine model
    const URL = "https://teachablemachine.withgoogle.com/models/5QJ9mrbFL/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
      // Load the model and metadata
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      // Set up webcam
      const flip = true;
      webcam = new tmImage.Webcam(300, 300, flip);
      await webcam.setup();
      await webcam.play();

      // Add webcam to the page
      document.getElementById("webcam-container").appendChild(webcam.canvas);

      // Create prediction labels
      labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";

      for (let i = 0; i < maxPredictions; i++) {
        labelContainer.appendChild(document.createElement("div"));
      }

      // Start prediction loop
      window.requestAnimationFrame(loop);
    }

    async function loop() {
      webcam.update();
      await predict();

      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);

      for (let i = 0; i < maxPredictions; i++) {
        const className = prediction[i].className;
        const probability = (prediction[i].probability * 100).toFixed(2);

        labelContainer.childNodes[i].innerHTML =
          `${className}: ${probability}%`;
      }
    }
  </script>

</body>
</html>
